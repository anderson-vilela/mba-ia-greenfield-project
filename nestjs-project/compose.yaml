services:
  nestjs-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=streamtube
      - POSTGRES_PASSWORD=streamtube
      - POSTGRES_DB=streamtube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  storage:
    # minio/minio's repository was archived — pin the last published release
    # (phase-03-videos/TD-04).
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=streamtube
      - MINIO_ROOT_PASSWORD=streamtube
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  storage-init:
    # One-shot bucket bootstrap (phase-03-videos/TD-05). mc is frozen along
    # with minio/minio, so it is pinned too (phase-03-videos/TD-04).
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 streamtube streamtube &&
      mc mb --ignore-existing local/streamtube-videos &&
      mc mb --ignore-existing local/streamtube-thumbnails"

  video-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    command: npm run start:worker
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      storage:
        condition: service_healthy


